# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish PitWall
        run: dotnet publish PitWall/PitWall.csproj -c Release -r win-x64 --self-contained true -o publish/PitWall

      - name: Zip PitWall
        run: Compress-Archive -Path publish/PitWall/* -DestinationPath PitWall-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: PitWall-win-x64.zip