# .github/workflows/release.yml
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish requires .NET build
        run: dotnet publish PitWall/PitWall.csproj -c Release -r win-x64 --self-contained false -o publish/requires-dotnet

      - name: Publish self-contained build
        run: dotnet publish PitWall/PitWall.csproj -c Release -r win-x64 --self-contained true -o publish/self-contained

      - name: Zip requires .NET build
        run: Compress-Archive -Path publish/requires-dotnet/* -DestinationPath PitWall-win-x64-requires-dotnet.zip

      - name: Zip self-contained build
        run: Compress-Archive -Path publish/self-contained/* -DestinationPath PitWall-win-x64-self-contained.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PitWall-win-x64-requires-dotnet.zip
            PitWall-win-x64-self-contained.zip